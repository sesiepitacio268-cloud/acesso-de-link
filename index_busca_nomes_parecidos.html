} estudantes.</strong><p>Selecione seu nome:</p><div class="lista">${itens}</div></div>`}else{r.innerHTML='<div class="err"><strong>Nome não localizado.</strong><p>Confira a grafia ou tente outra parte do seu nome.</p></div>'}}document.getElementById('buscar').onclick=buscar;document.getElementById('nome').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});</script></body></html>
